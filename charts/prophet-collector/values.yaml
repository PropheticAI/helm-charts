# Prophet Collector Helm Chart - values.yaml
#
# Service configuration (what to collect, interfaces, performance) comes from
# the controller via the node profile. Only bootstrap settings are needed here.

# -- Provision token for node registration (required)
# Get this from the Prophet UI: Nodes > New Node or Nodes > Profiles > Deploy
provisionToken: ""

# -- Profile ID to inherit configuration from (optional but recommended)
# Get this from the Prophet UI: Nodes > Profiles
profileId: ""

# -- Prophet environment (prod or dev)
env: prod

# -- Container image configuration
image:
  repository: propheticai/go-collector
  tag: latest
  pullPolicy: Always

# -- Image pull secrets (needed for private repos like go-collector-debug)
imagePullSecrets: []

# -- Persistent storage for collector state (credentials, node_id, binary, tags)
persistence:
  # -- Host path on each node for collector state. Matches the container path
  # so operators can read tags.txt and other files without translating paths.
  hostPath: /usr/local/prophet

# -- Resource requests/limits (collector auto-scales memory based on system RAM)
resources: {}

# -- Node selector for scheduling
nodeSelector: {}

# -- Tolerations (to run on all nodes including masters)
tolerations:
  - operator: Exists

# -- Additional environment variables
extraEnv: []

# -- eBPF flow→process correlation host access.
# Provisions the host access the collector needs to attribute flows to the OS
# process that owns them: the host PID namespace (resolve socket owners), the
# host cgroup-v2 root mounted (UDP BPF hook), CAP_SYS_ADMIN, and an unconfined
# seccomp profile (allow bpf()/perf syscalls).
#
# On by default so correlation is controlled entirely from the cloud — it
# ACTIVATES only when the node profile sets process_ids, and the eBPF stays off
# on kernels <5.8 / without BTF (the collector still captures and stitches
# normally). Leaving this on but not enabling process_ids has no runtime effect;
# the capability simply sits available. Set false only to deny the host access
# outright (e.g. a hardened cluster that will never use correlation).
processCorrelation:
  enabled: true
