apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "prophet-collector.fullname" . }}
  labels:
    {{- include "prophet-collector.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "prophet-collector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "prophet-collector.selectorLabels" . | nindent 8 }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- if .Values.processCorrelation.enabled }}
      # eBPF flow→process correlation needs the host PID namespace so the
      # /proc bootstrap can map socket inodes to host PIDs (see values.processCorrelation).
      hostPID: true
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: collector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            capabilities:
              add:
                - NET_RAW
                - NET_ADMIN
                {{- if .Values.processCorrelation.enabled }}
                # SYS_ADMIN grants bpf()/perf/cgroup-attach on all kernels
                # (subsumes CAP_BPF/CAP_PERFMON).
                - SYS_ADMIN
                {{- end }}
            {{- if .Values.processCorrelation.enabled }}
            # Default seccomp blocks bpf()/perf_event_open; Unconfined allows them.
            seccompProfile:
              type: Unconfined
            {{- end }}
          args:
            {{- if .Values.provisionToken }}
            - "--provision-token=$(PROVISION_TOKEN)"
            {{- end }}
            - "--env={{ .Values.env }}"
            - "--dynamic_node"
            - "--hostname=$(NODE_NAME)"
            {{- if .Values.profileId }}
            - "--profile_id={{ .Values.profileId }}"
            {{- end }}
          env:
            - name: PROVISION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "prophet-collector.fullname" . }}
                  key: provision-token
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: prophet-state
              mountPath: /usr/local/prophet
            - name: suricata-logs
              mountPath: /var/log/suricata
              readOnly: true
            {{- if .Values.processCorrelation.enabled }}
            # Host cgroup-v2 root for the cgroup/UDP BPF attach, and host kernel
            # BTF for CO-RE (most runtimes expose BTF via the default sysfs, but
            # mount it explicitly so it's not runtime-dependent).
            - name: host-cgroup
              mountPath: /sys/fs/cgroup
            - name: host-btf
              mountPath: /sys/kernel/btf
              readOnly: true
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: prophet-state
          hostPath:
            path: {{ .Values.persistence.hostPath | default "/var/lib/prophet-collector" }}
            type: DirectoryOrCreate
        - name: suricata-logs
          hostPath:
            path: /var/log/suricata
            type: DirectoryOrCreate
        {{- if .Values.processCorrelation.enabled }}
        - name: host-cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: host-btf
          hostPath:
            path: /sys/kernel/btf
            type: DirectoryOrCreate
        {{- end }}
