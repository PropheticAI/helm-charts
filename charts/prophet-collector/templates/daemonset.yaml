apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "prophet-collector.fullname" . }}
  labels:
    {{- include "prophet-collector.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "prophet-collector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "prophet-collector.selectorLabels" . | nindent 8 }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- if .Values.processCorrelation.enabled }}
      # eBPF flow→process correlation needs the host PID namespace so the
      # /proc bootstrap can map socket inodes to host PIDs (see values.processCorrelation).
      hostPID: true
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.persistence.migrateFromLegacyHostPath }}
      initContainers:
        # One-time, idempotent migration of collector state from the legacy host
        # path to the standard one. Copies only when the legacy state exists AND
        # the standard path doesn't already have it — so it's a no-op on fresh
        # nodes and after the first migration. Without this, the hostPath change
        # orphans each node's stored access_key and the collector falls back to
        # (interactive, headless-incompatible) device auth.
        - name: migrate-state
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ -f /legacy-state/collector_state.enc ] && [ ! -f /usr/local/prophet/collector_state.enc ]; then
                echo "[migrate-state] copying state from {{ .Values.persistence.migrateFromLegacyHostPath }} -> {{ .Values.persistence.hostPath }}"
                cp -an /legacy-state/collector_state.enc /legacy-state/device_credentials.json /legacy-state/tags.txt /usr/local/prophet/ 2>/dev/null || true
                echo "[migrate-state] done"
              else
                echo "[migrate-state] nothing to migrate (no legacy state, or already migrated)"
              fi
          volumeMounts:
            - name: prophet-state
              mountPath: /usr/local/prophet
            - name: legacy-state
              mountPath: /legacy-state
              readOnly: true
      {{- end }}
      containers:
        - name: collector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            capabilities:
              add:
                - NET_RAW
                - NET_ADMIN
                {{- if .Values.processCorrelation.enabled }}
                # SYS_ADMIN grants bpf()/perf/cgroup-attach on all kernels
                # (subsumes CAP_BPF/CAP_PERFMON).
                - SYS_ADMIN
                {{- end }}
            {{- if .Values.processCorrelation.enabled }}
            # Default seccomp blocks bpf()/perf_event_open; Unconfined allows them.
            seccompProfile:
              type: Unconfined
            {{- end }}
            {{- if .Values.hostLogs.seLinuxSpc }}
            # SELinux-enforcing hosts (Amazon Linux 2023, RHEL, Fedora, CentOS) deny
            # a container reading host /var/log — and especially auditd logs — even
            # as root, regardless of seccomp. spc_t (super-privileged container)
            # lifts that confinement so host-log access works. Leave false on
            # Debian/Ubuntu (AppArmor) hosts, where the mounts alone suffice.
            seLinuxOptions:
              type: spc_t
            {{- end }}
          args:
            {{- if .Values.provisionToken }}
            - "--provision-token=$(PROVISION_TOKEN)"
            {{- end }}
            - "--env={{ .Values.env }}"
            - "--dynamic_node"
            - "--hostname=$(NODE_NAME)"
            {{- if .Values.profileId }}
            - "--profile_id={{ .Values.profileId }}"
            {{- end }}
          env:
            - name: PROVISION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "prophet-collector.fullname" . }}
                  key: provision-token
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: prophet-state
              mountPath: /usr/local/prophet
            - name: suricata-logs
              mountPath: /var/log/suricata
              readOnly: true
            # Host log forwarding (read-only) — ALWAYS provisioned, like the
            # suricata mount. There is deliberately no helm enable flag: whether
            # host logs are collected is decided solely by the cloud/node config
            # (Nodes > services > host logs), so the feature is enabled in ONE
            # place. File sources (auth/audit/syslog/kern/cron/package) live under
            # /var/log, which also carries the persistent journal (/var/log/journal);
            # the volatile journal and machine-id (journalctl uses it to locate the
            # journal namespace) are separate paths.
            - name: host-var-log
              mountPath: /var/log
              readOnly: true
            - name: host-run-log-journal
              mountPath: /run/log/journal
              readOnly: true
            - name: host-machine-id
              mountPath: /etc/machine-id
              readOnly: true
            {{- if .Values.processCorrelation.enabled }}
            # Host cgroup-v2 root for the cgroup/UDP BPF attach, and host kernel
            # BTF for CO-RE (most runtimes expose BTF via the default sysfs, but
            # mount it explicitly so it's not runtime-dependent).
            - name: host-cgroup
              mountPath: /sys/fs/cgroup
            - name: host-btf
              mountPath: /sys/kernel/btf
              readOnly: true
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: prophet-state
          hostPath:
            path: {{ .Values.persistence.hostPath | default "/var/lib/prophet-collector" }}
            type: DirectoryOrCreate
        {{- if .Values.persistence.migrateFromLegacyHostPath }}
        - name: legacy-state
          hostPath:
            path: {{ .Values.persistence.migrateFromLegacyHostPath }}
            type: DirectoryOrCreate
        {{- end }}
        - name: suricata-logs
          hostPath:
            path: /var/log/suricata
            type: DirectoryOrCreate
        # Host log forwarding host paths — always provisioned (see volumeMounts).
        - name: host-var-log
          hostPath:
            path: /var/log
            type: Directory
        - name: host-run-log-journal
          hostPath:
            # Volatile journal store (hosts running journald with Storage=volatile
            # keep the journal here, not under /var/log). Created empty if absent.
            path: /run/log/journal
            type: DirectoryOrCreate
        - name: host-machine-id
          hostPath:
            path: /etc/machine-id
            type: File
        {{- if .Values.processCorrelation.enabled }}
        - name: host-cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: host-btf
          hostPath:
            path: /sys/kernel/btf
            type: DirectoryOrCreate
        {{- end }}
